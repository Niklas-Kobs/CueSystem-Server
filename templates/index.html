<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="main-header">
        <div class="header-text">
            <h1>Warteliste:</h1>
            <h3>Warte bitte bis deine Nummer aufgerufen wird</h3>
        </div>
        <img src="{{ url_for('static', filename='img/DummyLogoB.svg') }}" alt="Logo" class="main-logo">
    </header>

    <main class="list-container">
        <table class="queue-table">
            <thead>
                <tr class="list_head">
                    <th class="col-nr">Nummer:</th>
                    <th class="col-raum">Raum:</th>
                    <th class="col-status">Status:</th>
                </tr>
            </thead>
            <tbody>
                <tr id="row_1" class="row-card white">
                    <td class="col-nr"><span id="WNR_1" class="WNR">---</span></td>
                    <td class="col-raum"><h4><span id="Room_1" class="Timeestimate">---</span></h4></td>
                    <td class="col-status"><h4><span id="Status_1" class="Status">---</span></h4></td>
                </tr>
                <tr id="row_2" class="row-card grey">
                    <td class="col-nr"><span id="WNR_2" class="WNR">---</span></td>
                    <td class="col-raum"><h4><span id="Room_2" class="Timeestimate">---</span></h4></td>
                    <td class="col-status"><h4><span id="Status_2" class="Status">---</span></h4></td>
                </tr>
                <tr id="row_3" class="row-card white">
                    <td class="col-nr"><span id="WNR_3" class="WNR">---</span></td>
                    <td class="col-raum"><h4><span id="Room_3" class="Timeestimate">---</span></h4></td>
                    <td class="col-status"><h4><span id="Status_3" class="Status">---</span></h4></td>
                </tr>
                <tr id="row_4" class="row-card grey">
                    <td class="col-nr"><span id="WNR_4" class="WNR">---</span></td>
                    <td class="col-raum"><h4><span id="Room_4" class="Timeestimate">---</span></h4></td>
                    <td class="col-status"><h4><span id="Status_4" class="Status">---</span></h4></td>
                </tr>
                <tr id="row_5" class="row-card white">
                    <td class="col-nr"><span id="WNR_5" class="WNR">---</span></td>
                    <td class="col-raum"><h4><span id="Room_5" class="Timeestimate">---</span></h4></td>
                    <td class="col-status"><h4><span id="Status_5" class="Status">---</span></h4></td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer class="Time">
        <p>Aktuelle Zeit: <span id="clock">---</span></p>
    </footer>
    

    <dialog id="POPUP" class="POPUP">
        <div class="thPOP">
                <h3><span id="POP_H" class="POPH">---</span></h3>
                <p><span id="POP_T" class="POPT">---</span></p>
        </div>
    </dialog>

    <style>
        dialog::backdrop {
        background: rgba(0, 0, 0, 0.8);
        }
    </style>


<script>
    const callSound = new Audio("{{ url_for('static', filename='sounds/Alarm_2.wav') }}");
    let lastCallStates = {
        "PNR_1": null, "PNR_2": null, "PNR_3": null, "PNR_4": null, "PNR_5": null, "POPUP": false
    };
    function updateData() {
        const now = new Date();
        const currentTime = now.toLocaleTimeString('de-DE');
        const clockElement = document.getElementById('clock');
        if (clockElement) {
            clockElement.innerText = currentTime;
        }
        fetch('/show')
            .then(response => response.json())
            .then(data => {
                if (Object.keys(data).length > 0) {
                    
                    const pnrs = ["PNR_1", "PNR_2", "PNR_3", "PNR_4", "PNR_5","POPUP"];

                    pnrs.forEach((pnr, index) => {
                        const callKey = `call_${index + 1}`;
                        const currentCallStatus = data[pnr][callKey];

                        
                        if (currentCallStatus !== null && lastCallStates[pnr] !== currentCallStatus) {
                            console.log(`Sound wird abgespielt für ${pnr}`);
                            callSound.play().catch(error => {
                                console.log("Browser blockiert Sound ohne Interaktion:", error);
                            });
                        }

                        lastCallStates[pnr] = currentCallStatus;
                    });

                    
                }
            })
            .catch(error => console.error('Fehler beim Laden:', error));

        fetch('/show')
            .then(response => response.json())
            .then(data => {
                const keys = Object.keys(data);
                if (keys.length > 0) {
                    const lastKey = keys[keys.length - 1];
                    const lastEntry = data[lastKey];

                    document.getElementById('WNR_1').innerText = data["PNR_1"]["WNR_1"];
                    document.getElementById('Room_1').innerText = data["PNR_1"]["Room_1"];
                    document.getElementById('Status_1').innerText = data["PNR_1"]["Status_1"];

                    document.getElementById('WNR_2').innerText = data["PNR_2"]["WNR_2"];
                    document.getElementById('Room_2').innerText = data["PNR_2"]["Room_2"];
                    document.getElementById('Status_2').innerText = data["PNR_2"]["Status_2"];

                    document.getElementById('WNR_3').innerText = data["PNR_3"]["WNR_3"];
                    document.getElementById('Room_3').innerText = data["PNR_3"]["Room_3"];
                    document.getElementById('Status_3').innerText = data["PNR_3"]["Status_3"];

                    document.getElementById('WNR_4').innerText = data["PNR_4"]["WNR_4"];
                    document.getElementById('Room_4').innerText = data["PNR_4"]["Room_4"];
                    document.getElementById('Status_4').innerText = data["PNR_4"]["Status_4"];

                    document.getElementById('WNR_5').innerText = data["PNR_5"]["WNR_5"];
                    document.getElementById('Room_5').innerText = data["PNR_5"]["Room_5"];
                    document.getElementById('Status_5').innerText = data["PNR_5"]["Status_5"];

                    document.getElementById('POP_H').innerText = data["POPUP"]["POP_H"];
                    document.getElementById('POP_T').innerText = data["POPUP"]["POP_T"];

                    // 1. Das Popup steuern
                    const popup = document.getElementById('POPUP');
                    if (data["POPUP"] && data["POPUP"]["call_6"] === true) {
                        popup.showModal();
                    } else {
                        popup.close();
                    }

                    // 2. Die Karten (Zeilen) in einer Schleife verarbeiten
                    for (let i = 1; i <= 5; i++) {
                        const card = document.getElementById(`row_${i}`); // Holt row_1, row_2, etc.
                        const pnrData = data[`PNR_${i}`];

                        if (card && pnrData) {
                            const isCalled = pnrData[`call_${i}`];

                            // Status zurücksetzen
                            card.classList.remove('status-rot', 'status-green', 'status-green2');

                            if (isCalled === true) {
                                const greenClass = (i % 2 === 0) ? 'status-green2' : 'status-green';
                                card.classList.add(greenClass);
                            } 
                            else if (isCalled === false) {
                                // Wenn nicht aufgerufen (oder explizit false): Rot
                                card.classList.add('status-rot');
                            }
                        }
                    }
                }
            })
            .catch(error => console.error('Fehler beim Laden:', error));
    }
    setInterval(updateData, 500);
</script>
</body>
</html>
